[package]
name = "den-stdlib-temporal"
description = "ECMAScript Temporal API for den, backed by temporal_rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
den-util.workspace = true
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
temporal_rs = { workspace = true, features = ["sys", "compiled_data", "sys-local"] }

[dev-dependencies]
color-eyre.workspace = true
den-core = { workspace = true, features = ["stdlib"] }
libtest-mimic.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "test262"
path = "tests/test262.rs"
harness = false

[lints]
workspace = true
