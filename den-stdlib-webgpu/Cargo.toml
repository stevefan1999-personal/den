[package]
name = "den-stdlib-webgpu"
description = "Headless WebGPU API for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[lib]
test = false

[dependencies]
den-stdlib-worker = { workspace = true, default-features = false }
den-util.workspace = true
log.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
wgpu.workspace = true

[dev-dependencies]
color-eyre.workspace = true
den-core = { workspace = true, default-features = false, features = [
    "stdlib",
    "typescript",
] }
den-transpiler-oxc = { workspace = true, features = ["typescript"] }
libtest-mimic.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "cts"
path = "tests/cts.rs"
harness = false

[lints]
workspace = true
