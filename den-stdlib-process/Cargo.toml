[package]
name = "den-stdlib-process"
description = "Process, environment, spawn, signals and DNS lookup for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[lib]
test = false

[dependencies]
den-stdlib-core.workspace = true
either.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "signal",
    "sync",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
color-eyre.workspace = true
den-core = { workspace = true, features = ["stdlib"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
