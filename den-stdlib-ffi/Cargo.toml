[package]
name = "den-stdlib-ffi"
description = "Foreign function interface for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[lib]
test = false

[dependencies]
den-stdlib-core.workspace = true
den-util.workspace = true
dlopen2.workspace = true
libffi.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
# `spawn_blocking` for a `nonblocking` symbol, and the mailbox a foreign-thread
# callback posts to. `macros` is `tokio::select!` in the realm-side pump.
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

# `RTLD_NOW | RTLD_LOCAL`: dlopen2 defaults to `RTLD_LAZY | RTLD_LOCAL`, and a
# lazy binding turns a missing dependency into a SIGSEGV at the first call.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
color-eyre.workspace = true
den-core = { workspace = true, features = ["stdlib", "stdlib-ffi"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
