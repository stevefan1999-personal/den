[package]
name = "den-stdlib-worker"
description = "Web Workers API for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
den-stdlib-core.workspace = true
den-transpiler-oxc = { workspace = true, optional = true }
den-util.workspace = true
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures", "indexmap"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["transpile"]
transpile = ["dep:den-transpiler-oxc", "den-transpiler-oxc/transpile"]

[lints]
workspace = true
