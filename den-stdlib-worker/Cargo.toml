[package]
name = "den-stdlib-worker"
autotests = false
description = "Web Workers API for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
den-stdlib-core.workspace = true
den-transpiler-oxc = { workspace = true, optional = true }
den-util.workspace = true
dashmap.workspace = true
oxc_sourcemap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
color-eyre.workspace = true
den-core = { workspace = true, features = [
    "stdlib-assert",
    "stdlib-timer",
    "stdlib-worker",
    "typescript",
] }
insta.workspace = true

[features]
default = ["transpile"]
transpile = ["dep:den-transpiler-oxc"]
wasm = ["den-core/wasm"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
