name: test262

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "den-stdlib-temporal/**"
      - "vendor/test262/**"
      - ".gitmodules"
      - Cargo.lock
      - .github/workflows/test262.yml

jobs:
  temporal:
    runs-on: [self-hosted]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init vendor/test262
      - run: cargo nextest run --profile official -p den-stdlib-temporal --test test262
