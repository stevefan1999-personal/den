name: wpt

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "den-core/tests/wpt.rs"
      - "den-core/tests/wpt_adapter.js"
      - "den-core/tests/wpt_bootstrap.js"
      - "den-core/tests/wpt-serve.json"
      - "den-core/Cargo.toml"
      - "den-core/src/**"
      - "den-stdlib-*/Cargo.toml"
      - "den-stdlib-*/src/**"
      - "den-util/Cargo.toml"
      - "den-util/src/**"
      - ".gitmodules"
      - ".github/workflows/wpt.yml"
      - ".github/workflows/runner-route.yml"
      - "vendor/wpt"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  route:
    uses: ./.github/workflows/runner-route.yml

  wpt:
    needs: route
    runs-on: ${{ needs.route.outputs.shell }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Init vendor/wpt (shallow + sparse-checkout)
        run: |
          git submodule update --init --depth 1 --filter=blob:none vendor/wpt
          git -C vendor/wpt sparse-checkout init --cone
          git -C vendor/wpt sparse-checkout set resources common websockets wasm/jsapi url fetch FileAPI streams xhr tools/serve tools/wptserve tools/manifest tools/metadata tools/gitignore tools/third_party
      - name: Run WPT with wptserve
        run: >-
          ./scripts/wptserve.sh
          cargo nextest run --profile official -p den-core --test wpt
          --features stdlib,typescript,react,wasm,jit,ring
