name: targets

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [refactor]
    paths:
      - ".cargo/**"
      - ".config/nextest.toml"
      - ".github/musl-nextest.*"
      - ".github/workflows/targets.yml"
      - "den-*/**"
      - "src/**"
      - "tests/**"
      - "vendor/**"
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  pull_request:
    paths:
      - ".cargo/**"
      - ".config/nextest.toml"
      - ".github/musl-nextest.*"
      - ".github/workflows/targets.yml"
      - "den-*/**"
      - "src/**"
      - "tests/**"
      - "vendor/**"
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml

env:
  CARGO_INCREMENTAL: "0"
  # Hosted runners have 14 GB disks. Keep symbols for panic backtraces but do
  # not emit DWARF into every dependency and test binary.
  CARGO_PROFILE_TEST_DEBUG: "0"
  INSTA_UPDATE: "no"
  INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cc: cc
            cc_args: ""
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cc: cc
            cc_args: ""
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cc: cc
            cc_args: ""
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
          - target: aarch64-apple-darwin
            runner: macos-15
            cc: cc
            cc_args: ""
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            cc: clang
            cc_args: ""
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cc: clang
            cc_args: ""
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
          - target: i686-pc-windows-msvc
            runner: windows-2025
            cc: clang
            cc_args: --target=i686-pc-windows-msvc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc,rquickjs/bindgen
          - target: x86_64-pc-windows-gnullvm
            runner: windows-2025
            cc: x86_64-w64-mingw32-clang
            cc_args: ""
            bindgen_target: x86_64-w64-windows-gnu
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc,rquickjs/bindgen
          - target: aarch64-pc-windows-gnullvm
            runner: windows-11-arm
            cc: aarch64-w64-mingw32-clang
            cc_args: ""
            bindgen_target: aarch64-w64-windows-gnu
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc,rquickjs/bindgen
    env:
      DEN_TEST_CC: ${{ matrix.cc }}
      DEN_TEST_CC_ARGS: ${{ matrix.cc_args }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Fetch pinned WPT fixture
        shell: bash
        run: |
          wpt_rev=$(git ls-tree HEAD vendor/wpt | awk '{print $3}')
          fixture=vendor/wpt/fetch/data-urls/resources/data-urls.json
          mkdir -p "$(dirname "$fixture")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/web-platform-tests/wpt/$wpt_rev/fetch/data-urls/resources/data-urls.json" \
            -o "$fixture"
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }}
      - name: Install LLVM MinGW
        if: matrix.bindgen_target != ''
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - name: Configure bindgen for the LLVM MinGW ABI
        if: matrix.bindgen_target != ''
        shell: bash
        run: |
          root=$(cd "$(dirname "$(command -v clang)")/.." && pwd -W)
          resource=$(clang --print-resource-dir | sed 's#\\#/#g')
          target_key=$(printf %s '${{ matrix.target }}' | tr '-' '_')
          {
            printf 'CONFIG_SHELL=C:/PROGRA~1/Git/usr/bin/sh.exe\nSHELL=C:/PROGRA~1/Git/usr/bin/sh.exe\nMSYS2_ENV_CONV_EXCL=CONFIG_SHELL;SHELL\n'
            printf 'CC_%s=%s\n' "$target_key" '${{ matrix.cc }}'
            printf 'BINDGEN_EXTRA_CLANG_ARGS=--target=%s --sysroot="%s" -isystem "%s/include" -isystem "%s/include"\n' \
              '${{ matrix.bindgen_target }}' "$root" "$resource" "$root"
          } >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build and run unit and integration tests
        run: >-
          cargo nextest run --locked --profile compat --no-fail-fast --workspace
          --target ${{ matrix.target }} --no-default-features
          --features ${{ matrix.features }},package-store,ring

  cross-linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            cc: i686-linux-gnu-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
            qemu: ""
            rustflags: ""
          - target: x86_64-pc-windows-gnu
            cc: x86_64-w64-mingw32-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
            qemu: ""
            rustflags: ""
          - target: i686-pc-windows-gnu
            cc: i686-w64-mingw32-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc,rquickjs/bindgen
            qemu: ""
            rustflags: ""
          - target: aarch64-unknown-linux-musl
            cc: aarch64-linux-musl-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
            qemu: arm64
            rustflags: -C target-feature=-crt-static
          - target: arm-unknown-linux-gnueabi
            cc: arm-linux-gnueabi-gcc
            features: stdlib,typescript,react,mimalloc,rquickjs/bindgen
            qemu: arm
            rustflags: -C link-arg=-latomic
            wasm: "0"
          - target: arm-unknown-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            features: stdlib,typescript,react,mimalloc,rquickjs/bindgen
            qemu: arm
            rustflags: -C link-arg=-latomic
            wasm: "0"
          - target: armv7-unknown-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
            qemu: arm
            rustflags: ""
          # Tier 2 without host tools: full std, QEMU runner, and dynamic FFI.
          - target: armv7-unknown-linux-musleabihf
            cc: arm-linux-musleabihf-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc,rquickjs/bindgen
            qemu: arm
            rustflags: -C target-feature=-crt-static
          - target: loongarch64-unknown-linux-gnu
            cc: loongarch64-unknown-linux-gnu-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
            qemu: loong64
            rustflags: ""
          - target: loongarch64-unknown-linux-musl
            cc: loongarch64-unknown-linux-musl-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
            qemu: loong64
            rustflags: -C target-feature=-crt-static
          - target: powerpc64le-unknown-linux-gnu
            cc: powerpc64le-linux-gnu-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc,rquickjs/bindgen
            qemu: ppc64le
            rustflags: ""
          - target: x86_64-unknown-linux-musl
            cc: x86_64-linux-musl-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc
            qemu: ""
            rustflags: -C target-feature=-crt-static
          - target: riscv64gc-unknown-linux-gnu
            cc: riscv64-linux-gnu-gcc
            features: stdlib,typescript,react,wasm,wasi,jit,mimalloc,rquickjs/bindgen
            qemu: riscv64
            rustflags: ""
          - target: riscv64gc-unknown-linux-musl
            cc: riscv64-linux-musl-gcc
            features: stdlib,typescript,react,rquickjs/bindgen
            qemu: riscv64
            rustflags: -C target-feature=-crt-static
            wasm: "0"
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      BINDGEN_EXTRA_CLANG_ARGS_i686_pc_windows_gnu: >-
        --sysroot=/usr/i686-w64-mingw32
        -isystem /usr/lib/llvm-18/lib/clang/18/include
        -idirafter /usr/include
      CROSS_BUILD_ENV_PASSTHROUGH: >-
        ACTIONS_CACHE_SERVICE_V2 ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN
        BINDGEN_EXTRA_CLANG_ARGS_i686_pc_windows_gnu
        DEN_TEST_CC INSTA_UPDATE INSTA_WORKSPACE_ROOT
        RUST_BACKTRACE RUST_TEST_THREADS
        SCCACHE_GHA_ENABLED
        RUSTFLAGS TARGET TARGET_FEATURES TARGET_WASM CARGO_INCREMENTAL
        CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG
        CARGO_PROFILE_DEV_OPT_LEVEL CARGO_PROFILE_TEST_OPT_LEVEL
      DEN_TEST_CC: ${{ matrix.cc }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      RUST_TEST_THREADS: "1"
      SCCACHE_GHA_ENABLED: "true"
      TARGET: ${{ matrix.target }}
      TARGET_FEATURES: ${{ matrix.features }},package-store,ring
      TARGET_WASM: ${{ matrix.wasm }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Fetch pinned WPT fixture
        run: |
          wpt_rev=$(git ls-tree HEAD vendor/wpt | awk '{print $3}')
          fixture=vendor/wpt/fetch/data-urls/resources/data-urls.json
          mkdir -p "$(dirname "$fixture")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/web-platform-tests/wpt/$wpt_rev/fetch/data-urls/resources/data-urls.json" \
            -o "$fixture"
      - name: Install QEMU binfmt
        if: matrix.qemu != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: ${{ matrix.qemu }}
      - name: Install Rust
        run: >-
          rustup toolchain install stable --profile minimal --no-self-update
          --target ${{ matrix.target }}
      - name: Install cross
        env:
          RUSTC_WRAPPER: sccache
        run: >-
          cargo install cross --git https://github.com/cross-rs/cross
          --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Run nextest in the target image
        shell: bash
        run: |
          # cross-util discards the container exit status, so require a success marker.
          status_file="target/.nextest-$TARGET.ok"
          mkdir -p target
          cp "$SCCACHE_PATH" target/sccache
          rm -f "$status_file"
          # shellcheck disable=SC2016 # Expanded inside the cross container.
          cross-util run --target "$TARGET" -- '
            set -eu
            export RUSTC_WRAPPER=/target/sccache
            archive=/tmp/cargo-nextest.tar.gz
            curl --proto "=https" --tlsv1.2 -fsSLo "$archive" \
              https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz
            printf "%s  %s\n" \
              66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e \
              "$archive" | sha256sum -c -
            tar -xzf "$archive" -C /tmp

            set --
            if [ "${TARGET_WASM:-1}" = 0 ]; then
              set -- --exclude den-stdlib-wasm
            fi
            PATH=/tmp:$PATH cargo nextest run --locked --profile compat --no-fail-fast \
              --workspace "$@" --target "$TARGET" \
              --no-default-features --features "$TARGET_FEATURES" \
              --test-threads 1 --retries 2
            touch "/target/.nextest-$TARGET.ok"
          '
          test -f "$status_file"

  powerpc-musl:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: powerpc64le-unknown-linux-musl
            qemu: qemu-ppc64le
            sha256: 29eb5a3c3d7ce946cec2ff62251e9b3c754ce4661b9e0486d97c8d682a6527b4
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RUSTFLAGS: -C target-feature=-crt-static
      RUST_TEST_THREADS: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Fetch pinned WPT fixture
        run: |
          wpt_rev=$(git ls-tree HEAD vendor/wpt | awk '{print $3}')
          fixture=vendor/wpt/fetch/data-urls/resources/data-urls.json
          mkdir -p "$(dirname "$fixture")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/web-platform-tests/wpt/$wpt_rev/fetch/data-urls/resources/data-urls.json" \
            -o "$fixture"
      - name: Install Rust, QEMU, and libclang
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          sudo apt-get update
          sudo apt-get install -y libclang-dev qemu-user
      - name: Install musl cross-toolchain
        shell: bash
        run: |
          archive="$TARGET.tar.xz"
          base="https://github.com/cross-tools/musl-cross/releases/download/20260823"
          root="$RUNNER_TEMP/musl-cross"
          mkdir -p "$root"
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/$archive"
          printf '%s  %s\n' '${{ matrix.sha256 }}' "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$root"

          toolchain="$root/$TARGET"
          sysroot="$toolchain/$TARGET/sysroot"
          key=$(printf %s "$TARGET" | tr '-' '_')
          upper=$(printf %s "$key" | tr '[:lower:]' '[:upper:]')
          printf '%s/bin\n' "$toolchain" >> "$GITHUB_PATH"
          {
            printf 'AR_%s=%s/bin/%s-ar\n' "$key" "$toolchain" "$TARGET"
            printf 'BINDGEN_EXTRA_CLANG_ARGS_%s=--sysroot=%s\n' "$key" "$sysroot"
            printf 'CARGO_TARGET_%s_LINKER=%s/bin/%s-gcc\n' "$upper" "$toolchain" "$TARGET"
            printf 'CARGO_TARGET_%s_RUNNER=%s -cpu power10 -L %s\n' \
              "$upper" '${{ matrix.qemu }}' "$sysroot"
            printf 'CC_%s=%s/bin/%s-gcc\n' "$key" "$toolchain" "$TARGET"
            printf 'DEN_TEST_CC=%s/bin/%s-gcc\n' "$toolchain" "$TARGET"
            printf 'QEMU_CPU=power10\nQEMU_LD_PREFIX=%s\n' "$sysroot"
          } >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build and run unit and integration tests
        run: >-
          cargo nextest run --locked --profile compat --no-fail-fast --workspace
          --exclude den-stdlib-wasm --target ${{ matrix.target }}
          --no-default-features
          --features stdlib,typescript,react,mimalloc,package-store,ring,rquickjs/bindgen
          --test-threads 1

  musl-release:
    name: x86_64-unknown-linux-musl release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install musl target and toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build the default-static release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Smoke the static binary
        run: |
          file target/x86_64-unknown-linux-musl/release/den | grep -E 'static-pie|statically linked'
          target/x86_64-unknown-linux-musl/release/den --version

  musl-ffi:
    name: x86_64-unknown-linux-musl dynamic FFI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned WPT fixture
        run: |
          wpt_rev=$(git ls-tree HEAD vendor/wpt | awk '{print $3}')
          fixture=vendor/wpt/fetch/data-urls/resources/data-urls.json
          mkdir -p "$(dirname "$fixture")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/web-platform-tests/wpt/$wpt_rev/fetch/data-urls/resources/data-urls.json" \
            -o "$fixture"
      - name: Build pinned musl nextest image
        run: >-
          docker build --file .github/musl-nextest.Dockerfile
          --tag den-musl-nextest .github
      - name: Run FFI integration tests
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work:ro"
          --volume /cargo --volume /target
          den-musl-nextest
          run --locked -p den-stdlib-ffi --test ffi
          --no-default-features

  freebsd:
    name: x86_64-unknown-freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "2"
      DEN_TEST_CC: cc
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned WPT fixture
        run: |
          wpt_rev=$(git ls-tree HEAD vendor/wpt | awk '{print $3}')
          fixture=vendor/wpt/fetch/data-urls/resources/data-urls.json
          mkdir -p "$(dirname "$fixture")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/web-platform-tests/wpt/$wpt_rev/fetch/data-urls/resources/data-urls.json" \
            -o "$fixture"
      - name: Build and test on FreeBSD 15.1
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "15.1"
          arch: x86_64
          mem: 10240
          copyback: false
          envs: >-
            CARGO_BUILD_JOBS CARGO_INCREMENTAL CARGO_PROFILE_TEST_DEBUG
            DEN_TEST_CC INSTA_UPDATE RUST_BACKTRACE
          prepare: |
            pkg install -y bash ca_root_nss cmake-core curl git gmake llvm19-lite nasm perl5 pkgconf
            tzsetup UTC
            mkdir -p "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            curl -fsSL \
              https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-freebsd.tar.gz \
              | tar -xzf - -C "$HOME/.cargo/bin"
          run: |
            export PATH="$HOME/.cargo/bin:$PATH"
            export LIBCLANG_PATH=/usr/local/llvm19/lib
            cargo nextest run --locked --profile compat --no-fail-fast --workspace \
              --target x86_64-unknown-freebsd --no-default-features \
              --features stdlib,typescript,react,wasm,wasi,jit,mimalloc,package-store,ring,rquickjs/bindgen
