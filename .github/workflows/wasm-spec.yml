name: wasm-spec

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "den-stdlib-wasm/**"
      - "vendor/spec/**"
      - ".gitmodules"
      - Cargo.lock
      - .github/workflows/wasm-spec.yml
      - .github/workflows/runner-route.yml

jobs:
  route:
    uses: ./.github/workflows/runner-route.yml

  spec-core:
    needs: route
    runs-on: ${{ needs.route.outputs.shell }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
      - run: git submodule update --init --depth 1 vendor/spec
      - run: cargo nextest run --profile official -p den-stdlib-wasm --test spec_core
