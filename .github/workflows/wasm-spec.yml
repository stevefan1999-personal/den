name: wasm-spec

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "den-stdlib-wasm/**"
      - "vendor/spec/**"
      - ".gitmodules"
      - Cargo.lock
      - .github/workflows/wasm-spec.yml

jobs:
  spec-core:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init --depth 1 vendor/spec
      - run: cargo nextest run --profile official -p den-stdlib-wasm --test spec_core
