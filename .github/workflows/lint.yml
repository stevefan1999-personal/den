name: lint
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/lint.yml
      - .github/workflows/runner-route.yml

env:
  RUST_NIGHTLY: nightly-2026-08-22

jobs:
  route:
    uses: ./.github/workflows/runner-route.yml

  clippy:
    needs: route
    runs-on: ${{ needs.route.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component clippy
      - name: Reject evaluated stdlib bootstraps
        run: >-
          ! git grep -nE '\.(eval|eval_with_options)(::<\(\),|<\(\),)' --
          ':(glob)den-stdlib-*/src/**/*.rs'
          | grep -vE
          '^den-stdlib-worker/src/worker.rs:.*ctx\.eval_with_options::<\(\), _>\(source, Self::classic_options'
      - run: cargo +"$RUST_NIGHTLY" clippy --no-deps

  fmt:
    needs: route
    runs-on: ${{ needs.route.outputs.shell }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt
      - run: cargo +"$RUST_NIGHTLY" fmt --check

  docs:
    needs: route
    runs-on: ${{ needs.route.outputs.shell }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - run: cargo +"$RUST_NIGHTLY" doc --no-deps

  test:
    needs: route
    runs-on: ${{ needs.route.outputs.shell }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      INSTA_UPDATE: "no"
    strategy:
      fail-fast: false
      # Cranelift (`jit`) vs Pulley: they share the JS-API layer but not the
      # compiler target, so a green jit run says nothing about no-JIT hosts.
      matrix:
        extra: ["wasm,wasi,jit", "wasm,wasi"]
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
      # compat excludes official vendor binaries (spec_core / wpt / test262).
      # Those report official pass/fail in their own workflows.
      - run: cargo nextest run --profile compat --workspace --build-jobs 8 --no-default-features --features stdlib,typescript,react,package-store,ring,${{ matrix.extra }}
