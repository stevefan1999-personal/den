name: lint



permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/lint.yml

jobs:
  clippy:
    runs-on: [self-hosted]
    steps:
      - uses: olix0r/cargo-action-fmt/setup@v2
      - uses: actions/checkout@v4
      - run: rustup install nightly --profile complete
      - run: cargo +nightly clippy --no-deps --message-format=json | cargo-action-fmt

  fmt:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: olix0r/cargo-action-fmt/setup@v2
      - uses: actions/checkout@v4
      - run: rustup install nightly --profile complete
      - run: cargo +nightly fmt --check

  docs:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: olix0r/cargo-action-fmt/setup@v2
      - uses: actions/checkout@v4
      - run: rustup install nightly --profile complete
      - run: cargo +nightly doc --no-deps --message-format=json | cargo-action-fmt

  test:
    runs-on: [self-hosted]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Cranelift (`jit`) vs Pulley: they share the JS-API layer but not the
      # compiler target, so a green jit run says nothing about no-JIT hosts.
      matrix:
        extra: ["wasm,jit", "wasm"]
    steps:
      - uses: actions/checkout@v4
      # compat excludes official vendor binaries (spec_core / wpt / test262).
      # Those report official pass/fail in their own workflows.
      - run: cargo nextest run --profile compat --workspace --no-default-features --features stdlib,typescript,react,${{ matrix.extra }}
