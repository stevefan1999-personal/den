name: lint
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/lint.yml

jobs:
  clippy:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - run: rustup install nightly --profile complete
      - name: Reject evaluated stdlib bootstraps
        run: >-
          ! git grep -nE '\.(eval|eval_with_options)(::<|<|\()' --
          ':(glob)den-stdlib-*/src/**/*.rs'
          | grep -vE
          '^den-stdlib-worker/src/worker.rs:.*ctx\.eval_with_options::<\(\), _>\(source, Self::classic_options'
      - run: cargo +nightly clippy --no-deps

  fmt:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup install nightly --profile complete
      - run: cargo +nightly fmt --check

  docs:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup install nightly --profile complete
      - run: cargo +nightly doc --no-deps

  test:
    runs-on: [self-hosted]
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      INSTA_UPDATE: "no"
    strategy:
      fail-fast: false
      # Cranelift (`jit`) vs Pulley: they share the JS-API layer but not the
      # compiler target, so a green jit run says nothing about no-JIT hosts.
      matrix:
        extra: ["wasm,wasi,jit", "wasm,wasi"]
    steps:
      - uses: actions/checkout@v4
      # compat excludes official vendor binaries (spec_core / wpt / test262).
      # Those report official pass/fail in their own workflows.
      - run: cargo nextest run --profile compat --workspace --build-jobs 8 --no-default-features --features stdlib,typescript,react,ring,${{ matrix.extra }}
