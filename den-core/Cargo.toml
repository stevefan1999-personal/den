[package]
name = "den-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
cfg-if.workspace = true
derive_more.workspace = true
fmmap = { workspace = true, features = ["tokio"] }
matchit.workspace = true
mime.workspace = true
relative-path.workspace = true
# `default-tls` is rustls, and `charset`/`http2`/`system-proxy` come with the defaults too; only
# the body codecs and the streaming body are extra.
reqwest = { workspace = true, features = [
    "stream",
    "deflate",
    "gzip",
    "brotli",
] }
rquickjs.workspace = true
serde_json.workspace = true
# `block_in_place` + `Handle::current` in the loaders need these; without them den-core only
# builds when something else in the graph turns them on.
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
url.workspace = true
typed-builder.workspace = true

# Den specific stuff
den-stdlib-assert = { workspace = true, optional = true }
den-stdlib-console = { workspace = true, optional = true }
den-stdlib-core = { workspace = true, optional = true }
den-stdlib-crypto = { workspace = true, optional = true }
den-stdlib-ffi = { workspace = true, optional = true }
den-stdlib-fs = { workspace = true, optional = true }
den-stdlib-networking = { workspace = true, optional = true }
den-stdlib-process = { workspace = true, optional = true }
den-stdlib-sqlite = { workspace = true, optional = true }
den-stdlib-temporal = { workspace = true, optional = true }
den-stdlib-text = { workspace = true, optional = true }
den-stdlib-timer = { workspace = true, optional = true }
den-stdlib-wasm = { workspace = true, optional = true, default-features = false }
den-stdlib-whatwg = { workspace = true, optional = true }
den-stdlib-whatwg-fetch = { workspace = true, optional = true }
den-stdlib-worker = { workspace = true, optional = true, default-features = false }
den-transpiler-oxc = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
color-eyre.workspace = true
futures.workspace = true
libtest-mimic.workspace = true
rquickjs.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
# Reference assembler for the WebAssembly fixtures, and the yardstick den's own
# `den:wasm` `wat2wasm` is pinned against.
wat.workspace = true

[features]
default = ["stdlib", "typescript", "react", "wasm", "jit"]
typescript = [
    "transpile",
    "den-transpiler-oxc?/typescript",
]
react = ["transpile", "den-transpiler-oxc?/react"]
transpile = [
    "dep:den-transpiler-oxc",
    "den-transpiler-oxc?/transpile",
    "den-stdlib-worker?/transpile",
]

stdlib = [
    "stdlib-assert",
    "stdlib-console",
    "stdlib-core",
    "stdlib-crypto",
    "stdlib-fs",
    "stdlib-networking",
    "stdlib-process",
    "stdlib-sqlite",
    "stdlib-temporal",
    "stdlib-text",
    "stdlib-timer",
    "stdlib-whatwg-fetch",
    "stdlib-whatwg",
    "stdlib-worker",
]
stdlib-assert = ["dep:den-stdlib-assert"]
stdlib-console = ["dep:den-stdlib-console"]
stdlib-core = ["dep:den-stdlib-core"]
stdlib-crypto = ["dep:den-stdlib-crypto"]
stdlib-ffi = ["dep:den-stdlib-ffi"]
stdlib-fs = ["dep:den-stdlib-fs"]
stdlib-networking = ["dep:den-stdlib-networking"]
stdlib-process = ["dep:den-stdlib-process"]
stdlib-sqlite = ["dep:den-stdlib-sqlite"]
stdlib-temporal = ["dep:den-stdlib-temporal"]
stdlib-text = ["dep:den-stdlib-text"]
stdlib-timer = ["dep:den-stdlib-timer"]
stdlib-whatwg = ["dep:den-stdlib-whatwg"]
stdlib-whatwg-fetch = ["dep:den-stdlib-whatwg-fetch"]
stdlib-worker = ["dep:den-stdlib-worker"]

# `default-features = false` on the dep keeps `--features wasm` (no `jit`) from
# pulling Cranelift-native through den-stdlib-wasm's own default.
wasm = ["dep:den-stdlib-wasm"]
jit = ["den-stdlib-wasm?/jit"]

[[test]]
name = "wpt"
path = "tests/wpt.rs"
harness = false
required-features = ["stdlib"]

[lints]
workspace = true
