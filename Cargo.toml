[package]
name = "den"
description = "One word less than Deno!"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
clap = { workspace = true, features = ["unicode", "derive", "env"] }
color-eyre = { workspace = true, default-features = false }
console-subscriber = { workspace = true, optional = true }
den-core = { workspace = true, default-features = false }
futures.workspace = true
mimalloc = { workspace = true, optional = true }
rquickjs.workspace = true
rustyline = { workspace = true, features = ["derive", "with-sqlite-history"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }

[target.'cfg(windows)'.dependencies]
vc-ltl.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["stdlib", "typescript", "react", "wasm", "jit", "mimalloc"]
typescript = ["den-core/typescript"]
react = ["den-core/react"]
transpile = ["den-core/transpile"]

tokio-console = ["console-subscriber"]

stdlib = ["den-core/stdlib"]
stdlib-assert = ["den-core/stdlib-assert"]
stdlib-console = ["den-core/stdlib-console"]
stdlib-core = ["den-core/stdlib-core"]
stdlib-crypto = ["den-core/stdlib-crypto"]
stdlib-ffi = ["den-core/stdlib-ffi"]
stdlib-fs = ["den-core/stdlib-fs"]
stdlib-networking = ["den-core/stdlib-networking"]
stdlib-process = ["den-core/stdlib-process"]
stdlib-sqlite = ["den-core/stdlib-sqlite"]
stdlib-temporal = ["den-core/stdlib-temporal"]
stdlib-text = ["den-core/stdlib-text"]
stdlib-timer = ["den-core/stdlib-timer"]
stdlib-whatwg = ["den-core/stdlib-whatwg"]
stdlib-whatwg-fetch = ["den-core/stdlib-whatwg-fetch"]
stdlib-worker = ["den-core/stdlib-worker"]

wasm = ["den-core/wasm"]
jit = ["den-core/jit"]

mimalloc = ["dep:mimalloc"]

[profile.release]
incremental = true
lto = "thin"
strip = "debuginfo"

[profile.min-size-release]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"

[lints]
workspace = true
