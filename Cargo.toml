[workspace]

members = [
    "den-core",
    "den-stdlib-assert",
    "den-stdlib-console",
    "den-stdlib-core",
    "den-stdlib-crypto",
    "den-stdlib-ffi",
    "den-stdlib-fs",
    "den-stdlib-networking",
    "den-stdlib-path",
    "den-stdlib-process",
    "den-stdlib-sqlite",
    "den-stdlib-temporal",
    "den-stdlib-text",
    "den-stdlib-timer",
    "den-stdlib-wasm",
    "den-stdlib-whatwg",
    "den-stdlib-whatwg-fetch",
    "den-stdlib-worker",
    "den-transpiler-oxc",
    "den-util",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/stevefan1999-personal/den"
readme = "README.md"
authors = [
    "Steve Fan <29133953+stevefan1999-personal@users.noreply.github.com>",
]
license = "MIT"
keywords = ["javascript", "quickjs", "tokio", "typescript", "oxc"]

[workspace.dependencies]
# Workspace members (call sites keep optional / default-features / extra features).
den-core = { version = "0.4.0", path = "den-core", default-features = false }
den-stdlib-assert = { version = "0.4.0", path = "den-stdlib-assert" }
den-stdlib-console = { version = "0.4.0", path = "den-stdlib-console" }
den-stdlib-core = { version = "0.4.0", path = "den-stdlib-core" }
den-stdlib-crypto = { version = "0.4.0", path = "den-stdlib-crypto" }
den-stdlib-ffi = { version = "0.4.0", path = "den-stdlib-ffi" }
den-stdlib-fs = { version = "0.4.0", path = "den-stdlib-fs" }
den-stdlib-networking = { version = "0.4.0", path = "den-stdlib-networking" }
den-stdlib-path = { version = "0.4.0", path = "den-stdlib-path" }
den-stdlib-process = { version = "0.4.0", path = "den-stdlib-process" }
den-stdlib-sqlite = { version = "0.4.0", path = "den-stdlib-sqlite" }
den-stdlib-temporal = { version = "0.4.0", path = "den-stdlib-temporal" }
den-stdlib-text = { version = "0.4.0", path = "den-stdlib-text" }
den-stdlib-timer = { version = "0.4.0", path = "den-stdlib-timer" }
den-stdlib-wasm = { version = "0.4.0", path = "den-stdlib-wasm", default-features = false }
den-stdlib-whatwg = { version = "0.4.0", path = "den-stdlib-whatwg" }
den-stdlib-whatwg-fetch = { version = "0.4.0", path = "den-stdlib-whatwg-fetch" }
den-stdlib-worker = { version = "0.4.0", path = "den-stdlib-worker", default-features = false }
den-transpiler-oxc = { version = "0.4.0", path = "den-transpiler-oxc", default-features = false }
den-util = { version = "0.4.0", path = "den-util" }

# Shared third-party. Versions stay pinned to what the tree already declared;
# members name features (and optional / default-features) at the call site.
base64-simd = "0.8.0"
cfg-if = "1.0.4"
clap = "4.6.6"
color-eyre = { version = "0.6.5", default-features = false }
colored = "3.1.1"
console-subscriber = "0.5.0"
dashmap = "6.2.1"
delegate-attr = "0.3.1"
derive_more = { version = "2.1.1", features = [
    "deref_mut",
    "deref",
    "from",
    "into",
    "display",
    "from",
    "error",
    "debug",
] }
dlopen2 = "0.8.2"
either = "1.18.0"
encoding_rs = "0.8.35"
flate2 = "1"
fmmap = "0.5.0"
futures = "0.3.34"
http = "1.5.0"
indexmap = "2.14.0"
