[workspace]

members = [
    "den-core",
    "den-stdlib-console",
    "den-stdlib-core",
    "den-stdlib-crypto",
    "den-stdlib-fs",
    "den-stdlib-networking",
    "den-stdlib-process",
    "den-stdlib-sqlite",
    "den-stdlib-text",
    "den-stdlib-timer",
    "den-stdlib-wasm",
    "den-stdlib-whatwg",
    "den-stdlib-whatwg-fetch",
    "den-stdlib-worker",
    "den-transpiler-oxc",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/stevefan1999-personal/den"
readme = "README.md"
authors = [
    "Steve Fan <29133953+stevefan1999-personal@users.noreply.github.com>",
]
license = "MIT"
keywords = ["javascript", "quickjs", "tokio", "typescript", "oxc"]

[workspace.dependencies]
delegate-attr = "0.3.1"
derive_more = { version = "2.1.1", features = [
    "deref_mut",
    "deref",
    "from",
    "into",
    "display",
    "from",
    "error",
    "debug",
] }
either = "1.18.0"
futures = "0.3.34"
indexmap = "2.14.0"
rquickjs = { version = "0.12.2", features = [
    "full-async",
    "rust-alloc",
    "parallel",
    "indexmap",
    "either",
] }
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
typed-builder = "0.23.2"
reqwest = "0.13.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
# One module layout only: `foo.rs` + `foo/`, never `foo/mod.rs`. A tree of
# identically named `mod.rs` files is the one thing an editor tab strip, a
# stack trace and a grep hit all fail to tell apart.
mod_module_files = "deny"

[package]
name = "den"
description = "One word less than Deno!"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["unicode", "derive", "env"] }
color-eyre = { version = "0.6.5", default-features = false }
console-subscriber = { version = "0.5.0", optional = true }
den-core = { version = "*", path = "den-core", default-features = false }
futures.workspace = true
mimalloc = { version = "0.1.52", optional = true }
rquickjs.workspace = true
rustyline = { version = "18.0.1", features = ["derive", "with-sqlite-history"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[target.'cfg(windows)'.dependencies]
vc-ltl = "5.3.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["stdlib", "typescript", "react", "wasm-wasmtime", "mimalloc"]
typescript = ["den-core/typescript"]
react = ["den-core/react"]
transpile = ["den-core/transpile"]

tokio-console = ["console-subscriber"]

stdlib = ["den-core/stdlib"]
stdlib-console = ["den-core/stdlib-console"]
stdlib-core = ["den-core/stdlib-core"]
stdlib-crypto = ["den-core/stdlib-crypto"]
stdlib-fs = ["den-core/stdlib-fs"]
stdlib-networking = ["den-core/stdlib-networking"]
stdlib-process = ["den-core/stdlib-process"]
stdlib-sqlite = ["den-core/stdlib-sqlite"]
stdlib-text = ["den-core/stdlib-text"]
stdlib-timer = ["den-core/stdlib-timer"]
stdlib-whatwg = ["den-core/stdlib-whatwg"]
stdlib-whatwg-fetch = ["den-core/stdlib-whatwg-fetch"]
stdlib-worker = ["den-core/stdlib-worker"]

wasm = ["den-core/wasm"]
wasm-wasmtime = ["den-core/wasm-wasmtime"]
wasm-wasmi = ["den-core/wasm-wasmi"]

mimalloc = ["dep:mimalloc"]


[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
incremental = true
lto = "thin"
strip = "debuginfo"

[profile.min-size-release]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"

[lints]
workspace = true
