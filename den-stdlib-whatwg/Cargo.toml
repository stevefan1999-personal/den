[package]
name = "den-stdlib-whatwg"
description = "WHATWG web platform APIs for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
base64-simd.workspace = true
den-stdlib-networking.workspace = true
den-util.workspace = true
flate2.workspace = true
futures.workspace = true
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures", "indexmap"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
url.workspace = true
urlpattern.workspace = true

[features]
# Exposes the loopback test listener to other crates' test suites.
test = []

[dev-dependencies]
den-stdlib-text.workspace = true
den-stdlib-whatwg-fetch.workspace = true
den-stdlib-worker = { workspace = true, features = ["transpile"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
