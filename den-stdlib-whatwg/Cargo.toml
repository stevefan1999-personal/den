[package]
name = "den-stdlib-whatwg"
description = "WHATWG web platform APIs for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
base64-simd.workspace = true
cookie_store = { version = "0.22.1", features = ["preserve_order"] }
data-url.workspace = true
den-stdlib-networking.workspace = true
den-stdlib-worker = { workspace = true, default-features = false }
den-util.workspace = true
dashmap.workspace = true
flate2.workspace = true
futures.workspace = true
httpdate.workspace = true
indexmap.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = [
    "stream",
    "deflate",
    "gzip",
    "cookies",
    "brotli",
] }
rquickjs = { workspace = true, features = ["macro", "futures", "indexmap"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
url.workspace = true
urlpattern.workspace = true

[dev-dependencies]
color-eyre.workspace = true
den-core = { workspace = true, features = ["stdlib"] }
den-stdlib-text.workspace = true
den-stdlib-worker = { workspace = true, features = ["transpile"] }
http.workspace = true
insta.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-tungstenite.workspace = true

[features]
default = ["ring"]
ring = ["den-stdlib-networking/ring"]

[lints]
workspace = true
