[package]
name = "den-stdlib-whatwg-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
base64-simd.workspace = true
den-util.workspace = true
dashmap.workspace = true
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
tokio = { workspace = true, features = ["sync"] }
futures.workspace = true

reqwest = { workspace = true, features = [
    "stream",
    "deflate",
    "gzip",
    "cookies",
    "brotli",
] }
den-stdlib-whatwg.workspace = true
typed-builder.workspace = true

[dev-dependencies]
# `http::Response` is what `reqwest::Response` is built from, which is the only
# way to exercise a body without a socket.
color-eyre.workspace = true
den-core = { workspace = true, features = ["stdlib"] }
http.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
den-stdlib-text.workspace = true
den-stdlib-whatwg = { workspace = true, features = ["test"] }
den-stdlib-worker = { workspace = true, features = ["transpile"] }

[lints]
workspace = true
