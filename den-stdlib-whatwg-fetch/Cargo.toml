[package]
name = "den-stdlib-whatwg-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
den-util.workspace = true
derive_more.workspace = true
either.workspace = true
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
tracing.workspace = true
typed-builder.workspace = true
tokio = { workspace = true, features = ["sync"] }
futures.workspace = true

reqwest = { workspace = true, features = [
    "stream",
    "multipart",
    "json",
    "deflate",
    "gzip",
    "cookies",
    "brotli",
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
] }
serde_json.workspace = true
den-stdlib-whatwg.workspace = true

[dev-dependencies]
# `http::Response` is what `reqwest::Response` is built from, which is the only
# way to exercise a body without a socket.
http.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
den-stdlib-text.workspace = true
den-stdlib-whatwg = { workspace = true, features = ["test-support"] }
den-stdlib-worker = { workspace = true, features = ["transpile"] }

[lints]
workspace = true
