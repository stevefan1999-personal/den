[package]
name = "den-stdlib-whatwg-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
den-utils = { version = "*", path = "../den-utils", features = ["serde_json"] }
derivative.workspace = true
derive_more.workspace = true
either.workspace = true
getset = "0.1.7"
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
tracing.workspace = true
typed-builder.workspace = true
tokio = { workspace = true, features = ["sync"] }

reqwest = { workspace = true, features = [
    "stream",
    "multipart",
    "json",
    "deflate",
    "gzip",
    "cookies",
    "brotli",
    "native-tls",
] }
serde_json.workspace = true

[dev-dependencies]
# `http::Response` is what `reqwest::Response` is built from, which is the only
# way to exercise a body without a socket.
http = "1.2.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
