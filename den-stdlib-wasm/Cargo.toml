[package]
name = "den-stdlib-wasm"
description = "WebAssembly JS API for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
den-util.workspace = true
derive_more.workspace = true
either.workspace = true
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures", "array-buffer"] }
wat.workspace = true
wasmtime = { workspace = true, features = ["reexport-wasmparser", "pulley"] }
wasmtime-wasi.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures", "array-buffer"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wast.workspace = true

[[test]]
name = "spec_core"
path = "tests/spec_core.rs"
harness = false

[features]
default = ["jit"]
# cfg only: Cranelift and Pulley stay linked so modules compile at runtime.
# `jit` picks the native host triple; without it, Cranelift emits Pulley.
jit = []

[lints]
workspace = true
