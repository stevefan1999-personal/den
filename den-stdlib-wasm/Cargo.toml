[package]
name = "den-stdlib-wasm"
autotests = false
description = "WebAssembly JS API for den"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
den-util.workspace = true
indexmap.workspace = true
rquickjs = { workspace = true, features = ["macro", "futures"] }
wasmtime = { workspace = true, features = ["reexport-wasmparser", "pulley"] }
wasmtime-wasi = { workspace = true, optional = true }

[dev-dependencies]
color-eyre.workspace = true
den-core = { workspace = true, features = [
    "stdlib-assert",
    "wasm",
] }
insta.workspace = true
libtest-mimic.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wast.workspace = true
wat.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "spec_core"
path = "tests/spec_core.rs"
harness = false

[features]
default = ["jit"]
# cfg only: Cranelift and Pulley stay linked so modules compile at runtime.
# `jit` picks the native host triple; without it, Cranelift emits Pulley.
jit = []
wasi = ["dep:wasmtime-wasi"]

[lints]
workspace = true
